# The Copilot coding agent's environment: it runs these steps before working on
# an issue, so it starts with dependencies installed, the git hook in place and
# a passing npm test. The job must be named copilot-setup-steps. It can't reach
# Service Studio (docs/guide/AITools.md, "What runs where").
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (also installs the git hook)
        run: npm ci

      - name: Start from a passing build
        run: npm test
