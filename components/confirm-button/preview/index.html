<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>ConfirmButton preview</title>
		<!-- The base theme, as the app loads it: OutSystems UI from the installed package -->
		<link rel="stylesheet" href="../../../node_modules/outsystems-ui/dist/O11.OutSystemsUI.css" />
		<style>
			body {
				font-family: system-ui, sans-serif;
				max-width: 640px;
				margin: 32px auto;
				padding: 0 16px;
			}
			#log {
				font-family: ui-monospace, monospace;
				font-size: 13px;
				white-space: pre-wrap;
			}
			.pass {
				color: #0a7a2f;
			}
			.fail {
				color: #b00020;
				font-weight: 600;
			}
			.skip {
				color: #6a7178;
			}
		</style>
		<!-- The component's own stylesheet, as the app loads it -->
		<link rel="stylesheet" href="../dist/ConfirmButton.css" />
	</head>
	<body>
		<h1>ConfirmButton</h1>
		<p>A button for destructive actions that asks for a second click: the first click arms it, the second confirms, and it disarms after a few seconds, on blur or on Escape.</p>
		<p>Open with <code>?test=1</code> to run the checks. Add a modifier to the mount's classes to see it: <code>confirm-button--full-width</code>.</p>
		<!-- Mirrors the Block's main container: block class + ExtendedClass -->
		<div id="mount" class="confirm-button"></div>
		<p id="events"></p>
		<div id="log"></div>

		<script src="../dist/ConfirmButton.js"></script>
		<!-- The checks every component passes, then this component's own -->
		<script src="../../../packages/toolchain/structural-checks.js"></script>
		<script src="../test/checks.js"></script>
		<script>
			// The build registers the class on the namespace in factory.config.json; find it
			// without naming the namespace: the global that has __release and the class.
			var ConfirmButton = Object.keys(window)
				.map(function (k) {
					try {
						return window[k] && window[k].__release && window[k].ConfirmButton;
					} catch (e) {
						return null;
					}
				})
				.filter(Boolean)[0];
			function logEvent(text) {
				document.getElementById('events').textContent = text;
			}

			new ConfirmButton({
				label: 'Delete order',
				confirmLabel: 'Click again to delete',
				timeoutSeconds: 4,
				isDisabled: false,
				runtimeId: 'mount',
				events: {
					OnConfirmed: function () {
						logEvent('OnConfirmed(' + [].join(', ') + ')');
					},
				},
			});

			if (new URLSearchParams(location.search).get('test') === '1') {
				var results = runComponentChecks(window, ConfirmButton, componentTest);
				var log = document.getElementById('log');
				var failed = 0;
				results.forEach(function (r) {
					if (!r.ok) failed++;
					var line = document.createElement('div');
					line.className = r.skipped ? 'skip' : r.ok ? 'pass' : 'fail';
					line.textContent = (r.skipped ? 'SKIP  ' : r.ok ? 'PASS  ' : 'FAIL  ') + r.name + (r.skipped ? ' (CSS checks run in npm test)' : '');
					log.appendChild(line);
				});
				var summary = document.createElement('div');
				summary.textContent = '\n' + (results.length - failed) + '/' + results.length + ' passed';
				log.appendChild(summary);
			}
		</script>
	</body>
</html>
